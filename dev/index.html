<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodní fond – vývojářský přehled</title>
    <style>
      /* dev-only layout; colours come from the CSS variables written by applyTheme() */
      html, body { min-height: 100%; }
      body { margin: 0; background: var(--navy); color: var(--text); font: 15px/1.45 ui-rounded, 'Segoe UI', system-ui, sans-serif; }
      #root { max-width: 1100px; margin: 0 auto; padding: 20px 16px 56px; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      h2 { font-size: 18px; margin: 28px 0 10px; padding-top: 12px; border-top: 1px solid var(--blue); }
      p { margin: 0 0 8px; }
      code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--navy); border: 1px solid var(--blue); border-radius: 4px; padding: 0 4px; }
      a { color: var(--sea-light); }
      .muted { color: var(--muted); }
      .note-box { background: var(--navy); border: 2px solid var(--gold); border-radius: 8px; padding: 8px 12px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
      .card { display: flex; flex-direction: column; gap: 8px; background: var(--blue); border: 2px solid var(--navy); border-radius: 14px; padding: 14px; }
      .card h3 { margin: 0; font-size: 17px; }
      .card p { margin: 0; }
      .card ul { margin: 0; padding-left: 18px; flex: 1; }
      .card li { margin: 2px 0; }
      .card .tag { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--navy); background: var(--gold); border-radius: 999px; padding: 0 8px; }
      .card .tag.cli { background: var(--sea-light); }
      .btn { display: inline-block; align-self: flex-start; font: inherit; font-weight: 700; text-decoration: none; color: var(--navy); background: var(--gold); border: 2px solid var(--navy); border-radius: 999px; padding: 4px 16px; cursor: pointer; }
      .btn.secondary { color: var(--text); background: var(--navy); }
      .btn:focus-visible, a:focus-visible, .cmd button:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px; }
      .cmd { display: flex; gap: 8px; align-items: center; background: var(--navy); border: 1px solid var(--blue); border-radius: 8px; padding: 4px 8px; }
      .cmd code { flex: 1; border: none; padding: 0; overflow-x: auto; white-space: nowrap; }
      .cmd button { font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: var(--blue); border: 1px solid var(--sea-light); border-radius: 999px; padding: 1px 10px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--blue); vertical-align: top; }
      th { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
