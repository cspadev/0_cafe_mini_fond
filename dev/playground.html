<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodní fond – hřiště pro ladění</title>
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: var(--navy); color: var(--text); font: 14px/1.35 ui-rounded, 'Segoe UI', system-ui, sans-serif; }
      #root { height: 100%; }
      .pg { display: grid; grid-template-columns: minmax(320px, 1fr) 480px; height: 100vh; }
      .stage { position: relative; background: var(--sea); min-width: 0; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .stage .overlay { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
      .panel { overflow-y: auto; padding: 10px 12px 40px; border-left: 2px solid var(--blue); }
      .panel h2 { font-size: 15px; margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--blue); }
      .panel h2:first-child { border-top: none; margin-top: 0; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
      .row label { display: inline-flex; gap: 4px; align-items: center; }
      .pg button { font: inherit; font-weight: 700; color: var(--text); background: var(--blue); border: 2px solid var(--navy); border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 30px; }
      .pg button.primary { background: var(--gold); color: var(--navy); }
      .pg button.danger { border-color: var(--danger); background: transparent; }
      .pg button:disabled { opacity: 0.45; cursor: default; }
      .pg input[type='text'], .pg input[type='number'], .pg select, .pg textarea { font: inherit; background: var(--navy); color: var(--text); border: 2px solid var(--blue); border-radius: 8px; padding: 2px 6px; }
      .pg input[type='number'] { width: 80px; }
      .slider { display: grid; grid-template-columns: 150px 1fr 64px; gap: 6px; align-items: center; margin: 1px 0; }
      .slider input[type='range'] { width: 100%; margin: 0; }
      .slider .val { text-align: right; font-variant-numeric: tabular-nums; }
      .slider .changed { color: var(--gold); }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--blue); }
      th:first-child, td:first-child { text-align: left; }
      .muted { color: var(--muted); }
      .ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }
      pre { background: var(--navy); border: 1px solid var(--blue); padding: 6px; max-height: 160px; overflow: auto; font-size: 12px; }
      .pill { background: var(--navy); border: 2px solid var(--blue); border-radius: 999px; padding: 2px 10px; font-weight: 700; }
      @media (max-width: 900px) { .pg { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; height: auto; } .panel { border-left: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./playground.tsx"></script>
  </body>
</html>
